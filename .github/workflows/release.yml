# Changesets release flow. On every push to main the action either
# (a) opens/refreshes the "Version Packages" PR from pending changesets, or
# (b) if the versions on main are ahead of npm, publishes them.
# Publishing authenticates via npm trusted publishing: each package on
# npmjs.com names this repo's release.yml as its trusted publisher, and pnpm
# exchanges the GitHub Actions OIDC token for npm credentials per publish.
# No npm token or secret is involved.
name: Release

on:
  push:
    branches: [main]
  # Manual trigger so a publish can be re-run without pushing a commit.
  workflow_dispatch:

permissions:
  contents: write # push the version branch, create tags/releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm trusted publishing (OIDC) and provenance attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version packages & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # changesets inspects git history

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm build

      # changesets/action refuses to publish when it finds neither an .npmrc
      # nor an NPM_TOKEN env var. Real auth comes from trusted publishing
      # (OIDC), so a registry-only .npmrc satisfies that check without
      # holding any credential.
      - name: Point npm at the public registry
        run: echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"

      - name: Version PR / publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
